[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "setuptools-scm",
]

[dependency-groups]
dev = [
    "build",
    "ipywidgets>=8.1.8",
    "mypy",
    "pre-commit",
    "ruff",
    "tox",
    "twine",
]
docs = [
    "mkdocs-include-markdown-plugin",
    "mkdocs-material",
    "mkdocs<2",
    "mkdocstrings",
    "mkdocstrings-python",
]
test = [
    "pytest",
    "pytest-cov",
]

[project]
authors = [
    {email = "callum_lau@hotmail.com", name = "Callum Lau"},
]
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "blackjax>=1.5",
    "fastprogress>=1.1.6",
    "gpjax>=0.15.0",
    "hydra-core>=1.3.3",
    "hydra-joblib-launcher>=1.2.0",
    "matplotlib>=3.11.0",
    "pip>=26.1.2",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.3",
]
description = "Sampling Predictively Oriented Posteriors for Gaussian Processes"
dynamic = [
    "version",
]
keywords = [
]
license = "MIT"
license-files = [
    "LICENSE.md",
]
name = "non-parametric-pro"
readme = "README.md"
requires-python = ">=3.11"
urls.homepage = "https://github.com/callum-kl/non-parametric-pro"

[tool.coverage]
report = {sort = "cover"}
run = {branch = true, parallel = true, source = [
    "non-parametric-pro",
]}
paths.source = [
    "src",
    ".tox*/*/lib/python*/site-packages",
]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--import-mode=importlib",
    "--verbose",
]
testpaths = [
    "tests",
]

[tool.ruff]
extend-exclude = [
    "archive",
]
fix = true
force-exclude = true
lint.ignore = [
    "ANN", # type annotations are enforced by type checkers, not Ruff
    "ARG001", # unused args kept intentionally for signature consistency across sibling functions
    "C901", # cyclomatic complexity -- long fit scripts aren't meant to be split up
    "COM812", # trailing commas (ruff-format recommended)
    "D", # docstrings are opt-in in this codebase, not enforced
    "E501", # line length (ruff-format handles what it can; the rest is fine)
    "E731", # lambda-assignment (gpjax objective= callables are conventionally written this way)
    "EM102", # f-string-in-exception message style
    "ERA001", # false-positives on dict-shape-documenting comments (e.g. "# {a: {b: c}}")
    "FBT002",
    "FBT003", # positional booleans are fine for this codebase's own internal APIs
    "ICN001", # jnp/jr/gpx/ox/px are this codebase's own established aliases
    "INP001", # experiments/ and notebooks-adjacent scripts aren't meant to be packages
    "ISC001", # simplify implicit str concatenation (ruff-format recommended)
    "N806", # single/short-capital variable names (D, N, M, J, K, X, ...) are standard ML notation here
    "PERF401",
    "PLC0415", # intentional lazy/local imports (e.g. import csv inside a save_csv helper)
    "PLR0913", # config-heavy fit/adaptation functions legitimately take many kwargs
    "PLR0915", # long, linear fit scripts are the norm here, not a smell
    "PLR2004",
    "PLW2901",
    "PTH123", # open() vs Path.open() -- not worth the churn
    "RET504",
    "RUF003", # minor style nits, not worth enforcing
    "S310", # urlretrieve/urlopen usage is scheme-validated where it matters (_require_http_url)
    "S603", # subprocess calls here use static arg lists, not shell strings
    "T201", # print() is the standard output mechanism in these scripts/notebooks
    "TRY003", # plain ValueError(msg) is fine, no custom exception hierarchy here
]
lint.per-file-ignores = {"tests*" = [
    "INP001", # File is part of an implicit namespace package.
    "S101", # Use of `assert` detected
]}
lint.select = [
    "ALL",
]
lint.isort.known-first-party = [
    "non_parametric_pro",
]
lint.mccabe.max-complexity = 18
lint.pep8-naming.classmethod-decorators = [
    "classmethod",
]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/non_parametric_pro/_version.py"

[tool.tomlsort]
all = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
overrides."project.classifiers".inline_arrays = false
overrides."tool.coverage.paths.source".inline_arrays = false
overrides."tool.tox.env.docs.commands".inline_arrays = false
overrides."tool.tox.env_run_base.commands".inline_arrays = false

[tool.tox]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
]
env_run_base = {commands = [
    [
        "-",
        "pytest",
        "--cov",
        "--cov-report=xml",
    ],
], dependency_groups = [
    "test",
]}
env.docs = {commands = [
    [
        "mkdocs",
        "build",
        "--strict",
    ],
], dependency_groups = [
    "docs",
]}
gh.python."3.11" = ["py311"]
gh.python."3.12" = ["py312"]
gh.python."3.13" = ["py313"]
gh.python."3.14" = ["py314"]
