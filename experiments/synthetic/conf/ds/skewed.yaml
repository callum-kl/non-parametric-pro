# noise_skewness is the Lognormal shape sigma now, not the exact population skewness
# (see non_parametric_pro.data.skewed's module docstring) -- 0.6 gives population
# skewness ~2.3 with a broadly, visibly asymmetric body (not a spike-plus-outliers
# shape, which is what the old Gamma-based values like 5.0 gave).
source: skewed
param_name: noise_skewness
noise_skewness: 0.7
noise_std_frac: 0.3
ell_range: [0.5, 1.0]
n: 400
