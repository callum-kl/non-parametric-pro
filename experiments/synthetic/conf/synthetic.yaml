defaults:
  - _self_
  - ds@_global_: heteroskedastic
  - override hydra/launcher: joblib

seed: 2421
algorithm: standard_gp
num_instances: 20

results_root: ${script_dir:}/results

kernel:
  lengthscale: 1.0

pro:
  algorithm: replica_gibbs # 'ula' or 'replica_gibbs'
  step_size: 0.0001
  alpha: 1.4
  sigma_init: 0.3
  sigma_min: 0.03
  sigma_max: 1.0
  num_particles: 50
  val_fraction: 0.3
  num_adapt_steps: 200
  warmup_steps: 3
  sigma_adapt_steps: 90
  kernel_adapt_steps: 200
  sigma_lr: 0.1
  kernel_lr: 0.5
  kernel_steps_per_adapt: 1
  num_sample_steps: 100
  burn_fraction: 0.75
  thin: 5

hydra:
  launcher:
    n_jobs: 8
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
