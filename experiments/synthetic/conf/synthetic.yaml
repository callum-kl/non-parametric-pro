defaults:
  - _self_
  - ds@_global_: heteroskedastic

seed: 2421
mode: evaluate
algorithm: standard_gp
num_instances: 10
instance_index: 0 # only used by mode=instance -- see debug_instance()

results_root: ${script_dir:}/results

kernel:
  lengthscale: 0.3

pro:
  algorithm: replica_gibbs # 'ula' or 'replica_gibbs'
  step_size: 0.0001
  alpha: 1.0
  sigma_init: 0.3
  sigma_min: 0.1
  sigma_max: 1.0
  num_particles: 32
  val_fraction: 0.25
  num_adapt_steps: 200
  warmup_steps: 10
  sigma_adapt_steps: 100
  kernel_adapt_steps: 100
  sigma_lr: 0.1
  kernel_lr: 0.05
  num_sample_steps: 100
  burn_fraction: 0.5
  thin: 10

panel:
  num_instances: 20
  grid_shape: [5, 4]

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
