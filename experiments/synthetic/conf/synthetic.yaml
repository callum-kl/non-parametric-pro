defaults:
  - _self_
  - ds@_global_: heteroskedastic
  - override hydra/launcher: joblib

seed: 2421
num_instances: 20

results_root: ${script_dir:}/results

algorithms: [standard_gp, pro_gp]
pro_label: pro_gp

kernel:
  lengthscale: 1.0

pro:
  alpha: 1.4
  sigma_init: 0.4
  sigma_min: 0.01
  sigma_max: 100.0
  num_particles: 50
  val_fraction: 0.3
  num_adapt_steps: 50
  warmup_steps: 1
  sigma_adapt_steps: 49
  kernel_adapt_steps: 0
  sigma_lr: 0.1
  kernel_lr: 0.5
  kernel_steps_per_adapt: 1
  num_sample_steps: 30
  burn_fraction: 0.5
  thin: 2

mixture:
  ks: [1, 2, 3, 5, 10]
  gamma: 1.0
  sparse_k: 10
  sparse_gamma: 0.01
  select_k: true
  val_fraction: 0.3
  sigma_prior_shape: 2.0
  num_steps: 2000
  burn_fraction: 0.5
  thin: 10
  shared_sigma: false

hydra:
  launcher:
    n_jobs: 4
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
