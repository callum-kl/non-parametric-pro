split: 1
seed: 0
split_seed_offset: 0 # partition seed = split + offset; num_train=225 used 1000
num_train: 250 # must match the exact GP fit this run loads
name: gibbs_50

num_particles: 50
alpha: 1.4

sigma_min: 0.01
sigma_max: 100.0
sigma_init: null # defaults to the exact GP's fitted sigma
sigma_lr: 0.1

val_fraction: 0.3
num_adapt_steps: 100
warmup_steps: 5
sigma_adapt_steps: 95

num_sample_steps: 30
burn_fraction: 0.5
thin: 2

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
