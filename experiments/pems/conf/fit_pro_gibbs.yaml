split: 1
seed: 0
gp_name: null
name: gibbs

num_train: 250

default_kernel_init: false

results_root: ${script_dir:}/results

num_particles: 25
alpha: 1.4
step_size: 0.0001

sigma_min: 0.1
sigma_max: 100.0
sigma_init: null
sigma_lr: 0.1

algorithm: replica_gibbs
sgld_batch_size: 128

val_fraction: 0.3
adapt_target: null

num_adapt_steps: 100
warmup_steps: 5
sigma_adapt_steps: 95
kernel_adapt_steps: 0
kernel_lr: 0.05

num_sample_steps: 30
burn_fraction: 0.5
thin: 2

energy_score_draws: 256

# See fit_exact_gp.yaml's comment -- must match whatever that script used to
# produce the loaded gp_state, so the same sensors are shifted here too. Also set
# gp_name to match fit_exact_gp.py's name= for this run (e.g. both =regime_shift),
# otherwise this loads the *unshifted* baseline exact-GP state instead.
regime_shift:
  enabled: false
  seed_node: 415
  radius_m: 3000
  shift_factor: 0.29 # ~71% slowdown -- severe congestion (e.g. ~27.5mph -> ~8mph)

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
