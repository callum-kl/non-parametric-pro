split: 1
seed: 0
name: null
split_seed_offset: 0 # partition RNG seed = split + split_seed_offset; split alone still labels the results dir

num_train: 250

lengthscale_init: 5.0
lengthscale_min: 1.0e-2
lengthscale_max: 1.0e2

smoothness_init: 3.0
smoothness_min: 0.5
smoothness_max: 20.0

objective: mll

num_iters: 3000
kernel_lr: 0.05

num_restarts: 1
restart_jitter_std: 0.75

num_predictive_draws: 256

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
