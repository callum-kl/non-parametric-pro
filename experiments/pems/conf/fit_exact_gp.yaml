split: 1
seed: 0
num_train: 250

lengthscale_min: 1.0e-2
lengthscale_max: 1.0e2

# lengthscale init and fixed smoothness are each drawn from U(init_min, init_max)
num_restarts: 5
init_min: 1.0
init_max: 10.0

num_iters: 200
kernel_lr: 0.1

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
