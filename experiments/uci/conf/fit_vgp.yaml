defaults:
  - _self_
  - ds@_global_: yacht

split: 1
seed: 0
name: null

gp_num_iters: 15000
kernel_lr: 0.1
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3
vgp_batch_size: 512
num_inducing: 200
collapsed: true
natural_gradients: true
natural_lr: 0.5

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
