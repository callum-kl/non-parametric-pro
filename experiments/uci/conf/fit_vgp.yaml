defaults:
  - _self_
  - ds@_global_: yacht  # override with: "ds@_global_=<name>"

split: 1
seed: 0
name: null  # optional suffix for the results dir, e.g. name=untuned -> vgp_untuned

gp_num_iters: 15000
kernel_lr: 0.1
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3
vgp_batch_size: 512
num_inducing: 200
collapsed: true  # true -> CollapsedVariationalGaussian + collapsed_elbo; false -> VariationalGaussian + elbo
natural_gradients: true  # only when collapsed=false: natural-gradient q(u) steps + Adam on the rest
natural_lr: 0.5  # natural-gradient ascent step size on q(u); only used when natural_gradients=true

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
