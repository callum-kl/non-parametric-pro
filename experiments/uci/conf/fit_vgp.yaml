defaults:
  - _self_
  - ds@_global_: servo

split: 1
seed: 0
name: null

gp_num_iters: 10000
kernel_lr: 0.01
train_kernel_variance: true
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3
variance_min: 0.1
variance_max: 10.0
vgp_batch_size: 512
num_inducing: 200
collapsed: false
natural_gradients: false
natural_lr: 0.5

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
