defaults:
  - _self_
  - ds@_global_: wine

split: 1
seed: 0
inducing: true
vgp_variant: noncollapsed
vgp_name: null
gp_name: null
name: null

results_root: ${script_dir:}/results

num_particles: 50
step_size: null

sigma_min: 0.01
sigma_max: 100.0
sigma_init: 0.4
sigma_lr: 0.1

algorithm: replica_gibbs

# alpha = c / sqrt(n); `sqrt_n` resolves to sqrt(n) at runtime, i.e. alpha = 1.
c_grid: [sqrt_n, 10, 100, 1000]
val_fraction: 0.3
adapt_target: null

num_adapt_steps: 100
warmup_steps: 5
sigma_adapt_steps: 95
kernel_adapt_steps: 0
kernel_lr: 0.01

num_sample_steps: 30
burn_fraction: 0.5
thin: 1

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
