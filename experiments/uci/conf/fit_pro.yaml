defaults:
  - _self_
  - ds@_global_: yacht  # override with: "ds@_global_=<name>"

split: 1
seed: 0
inducing: false  # true → reads VGP state; false → reads exact GP state
name: null  # optional suffix for the results dir, e.g. name=untuned -> pro_gp_untuned

results_root: ${script_dir:}/results

num_particles: 50
alpha: 1.0
sigma_min: 0.1
initial_sigma: null  # override the loaded GP state's sigma; null -> use the loaded value

# per-dataset defaults; ds yaml values take priority via @_global_ merge
num_adapt_steps: 50
num_sample_steps: 30000
step_size: 1.0e-4

warmup_steps: 2000
sigma_adapt_every: -1
kernel_adapt_every: -1
sigma_lr: 0.1
kernel_lr: 0.01
val_fraction: 0.2

burn_fraction: 0.9
thin: 50

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
