defaults:
  - _self_
  - ds@_global_: yacht

split: 1
seed: 0
inducing: false
vgp_variant: collapsed
vgp_name: null
name: null

results_root: ${script_dir:}/results

num_particles: 50
alpha: 1.0
sigma_min: 0.1
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3

algorithm: ula
sgld_batch_size: 512

num_folds: 1
val_fraction: 0.2

num_adapt_steps: 10000
num_sample_steps: 30000
step_size: 0.0001

warmup_steps: 1000
sigma_adapt_steps: 600
kernel_adapt_steps: 300
sigma_lr: 0.1
kernel_lr: 0.01

burn_fraction: 0.9
thin: 50

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
