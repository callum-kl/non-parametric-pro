defaults:
  - _self_
  - ds@_global_: machine

split: 1
seed: 0
inducing: false
vgp_variant: noncollapsed
vgp_name: null

# OMGP with a shared noise scale, for each number of components in ks.
ks: [1, 2, 3, 5, 10, 20]
gamma: 1.0
sigma_prior_shape: 2.0
num_steps: 1000
burn_fraction: 0.5
thin: 10

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
