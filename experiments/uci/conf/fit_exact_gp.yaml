defaults:
  - _self_
  - ds@_global_: servo # override with: "ds@_global_=<name>"

split: 1
seed: 0
name: null # optional suffix for the results dir, e.g. name=untuned -> exact_gp_untuned

kernel_lr: 0.1
train_kernel_variance: true # learn the RBF outputscale; false pins it to 1.0
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3

objective: mll # "mll" (conjugate_mll) | "loocv" (conjugate_loocv, Rasmussen & Williams sec. 5.4.2)

# L-BFGS multi-start: restart 0 uses the deterministic sqrt(D) init; restarts 1..N-1
# jitter each ARD dimension's init log-lengthscale (std=restart_jitter_std) from
# cfg.seed, keeping whichever restart reaches the best negative MLL.
num_restarts: 1
restart_jitter_std: 0.75

results_root: ${script_dir:}/results

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
