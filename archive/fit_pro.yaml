defaults:
  - _self_
  - ds@_global_: yacht

split: 1
seed: 0
inducing: false
vgp_variant: noncollapsed
vgp_name: null
gp_name: null  # optional suffix matching fit_exact_gp.py's own `name` override, if that run used one
               # (e.g. gp_name=loo -> reads exact_gp_loo); only used when inducing=false
name: null

results_root: ${script_dir:}/results

num_particles: 50
alpha: 1.0
sigma_min: 0.1
lengthscale_min: 1.0e-3
lengthscale_max: 1.0e3

algorithm: ula
sgld_batch_size: 512

num_folds: 3
val_fraction: 0.5

num_adapt_steps: 10000
num_sample_steps: 30000
step_size: 0.0001

warmup_steps: 1000
sigma_adapt_steps: 600
kernel_adapt_steps: 300
sigma_lr: 0.1
kernel_lr: 0.01

# Which fold data sigma/kernel adaptation is fit against -- "train", "val", or null
# (default: sigma on the fold's held-out chunk, kernel always on the fold's training
# chunk -- see non_parametric_pro.parameter_adaptation.base's docstring)
adapt_target: null

burn_fraction: 0.9
thin: 50

hydra:
  job:
    chdir: false
  run:
    dir: ${script_dir:}/.hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${script_dir:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
